name: Deploy to GitHub Pages

on:
  push:
    branches:
      - dev-2
  pull_request:
  workflow_dispatch:

# Least privilege: jobs can only read the repo unless they need more (see deploy)
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment): a moved tag can't change what runs here
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Vitest 5 requires Node ^22.12 || ^24 || >=26
          node-version: 22
          cache: npm

      # Dependencies' install scripts are not run; nothing here needs them
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Quality gates: any failure blocks the Pages deploy below
      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Only the release branch reaches the live site: never pull requests, or a manual run from another branch
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev-2'
    # Only the deploy job may publish to Pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
