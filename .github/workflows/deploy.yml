name: Deploy to GitHub Pages

on:
  push:
    branches:
      - dev-2
  pull_request:
  workflow_dispatch:

# Least privilege: jobs can only read the repo unless they need more (see deploy)
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vitest 5 requires Node ^22.12 || ^24 || >=26
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Quality gates: any failure blocks the Pages deploy below
      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Pull requests run the gates and build only; they never deploy
    if: github.event_name != 'pull_request'
    # Only the deploy job may publish to Pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
